[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Conservative EVM target for a new chain — PUSH0 yes, no Cancun-only opcodes.
# Re-verify Arc's EVM version before deploy; bump to "cancun" only if confirmed.
evm_version = "shanghai"
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./" }]
gas_reports = ["ContinuityVault", "SuccessionPlan", "Guardian2of3"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[profile.default.fuzz]
runs = 512
max_test_rejects = 200000

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false
call_override = false

# Heavier settings for CI / pre-submission runs: `FOUNDRY_PROFILE=ci forge test`
[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 64

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

# Re-enable when Arc exposes an Etherscan-compatible verifier and ARC_VERIFIER_URL is set.
# An empty `url` here triggers forge's "relative URL without a base" error on --broadcast.
# [etherscan]
# arc_testnet = { key = "${ARC_ETHERSCAN_API_KEY}", url = "${ARC_VERIFIER_URL}", chain = 5042002 }
